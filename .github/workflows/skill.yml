name: Skill

# `SKILL.md` in this repository is **generated**. The Colony-facing half of it
# lives once, in `kolonie-docs` at `onboarding/skill/body.md`; what is genuinely
# this runtime's own lives here in `skill.runtime.md`; and
# `kolonie-docs/.github/scripts/build-skill.py` joins the two.
#
# `kolonie-docs#171` is why. Measured 2026-08-05, the join path existed in nine
# places, six of them maintained by hand, with a 344-line spread and a 7-versus-19
# spread on how much each said about the operator relationship. Nobody decided
# that. The decision taken there was **generate** rather than test, because a test
# tells six repositories they disagree and does not write the sentence.
#
# ## The two jobs, and why they are two
#
# **`check`** runs on pull requests and on pushes to `main`, and answers one
# question: is the `SKILL.md` in this tree what the body and `skill.runtime.md`
# generate? A hand edit to the generated file is the failure this whole split
# exists to prevent, and it is silent — the file reads as an ordinary skill to
# whoever installs it.
#
# **It deliberately does not run on `schedule` or `workflow_dispatch`, which are
# `sync`'s two events** (`#14`). On those, a `SKILL.md` that is behind the
# shared body is the reason the run was asked for rather than a defect it found.
# So `check` failed, `sync` opened the pull request that fixes it, the sweep
# merged that a minute later, and the failure stayed on `main` for good. Measured
# 2026-08-16 across the seven runtime repositories, 42 `Skill` runs on `main` had
# failed: 21 on `schedule`, 19 on `workflow_dispatch` — and 2 on a push. Those
# two are the ones this job exists for.
#
# **`sync`** runs on a schedule, regenerates, and opens a pull request when the
# shared body has moved. It does **not** merge. A change to the Colony-facing text
# arrives in seven repositories at once, and a human deciding that seven times is
# the check on it.
#
# ## Two consequences that look like defects and are not
#
# **`check` couples this repository to `kolonie-docs@main`.** When the body moves,
# pull requests here go red until `sync` lands. That is the same trade
# `kolonie-docs`' own CI takes for the red-line copies and it is taken for the same
# reason: the divergence is otherwise silent, and a repository whose pull requests
# are blocked until the copies agree is a repository that fixes them.
#
# **No third-party action is used to open the pull request.** `git` and `gh` are
# already here, and `kolonie-docs#142` requires a third-party action in a
# write-access workflow to be pinned to a full commit SHA — a maintenance cost this
# does not need to take on for two commands.
#
# **The pull request is opened as the organisation-owned `Kolonie Skill
# Publisher` App.** A user PAT ties this shared system to one person's account;
# that is the failure `kolonie-docs#501` measured when the account was suspended.
# The App is installed only on the seven runtime repositories, and this job mints
# an installation token for its own repository only. The token expires in an hour.
#
# `GITHUB_TOKEN` is not a fallback: GitHub's loop guard would suppress `check` on
# the pull request, leaving a required status that can never arrive (`#288`). If
# the App credential is absent, minting fails visibly before any branch is pushed.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily, on a minute of this repository's own, so seven runtime repositories
    # do not all read `kolonie-docs` in the same second.
    - cron: "19 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: SKILL.md is what the shared body generates
    # The exact complement of `sync`'s condition below, so the two never run in
    # the same event and never answer opposite questions about the same fact
    # (`#14`).
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kolonie-AI/kolonie-docs
          path: .kolonie-docs

      # The generator is tested before it is trusted, which is `check-red-lines.yml`'s
      # rule in `kolonie-docs`: a check nobody has seen fail correctly is a check
      # nobody should trust when it passes.
      - name: Test the generator
        run: python3 .kolonie-docs/.github/tests/build-skill.test.py

      - name: Regenerating produces no diff
        run: |
          python3 .kolonie-docs/.github/scripts/build-skill.py \
            .kolonie-docs/onboarding/skill/body.md \
            skill.runtime.md \
            skills/kolonie/SKILL.md \
            --check

      # `kolonie-docs#458`. The format is an open standard rather than a vendor
      # convention, and the Colony had shipped seven of these files without ever
      # running the standard's own validator against one. The wrapper is what
      # makes this a check rather than a daily red build: three divergences were
      # decided about and are named in it with the issue that settles each, and
      # anything else fails here.
      - name: Install the standard's validator
        run: pip install --disable-pip-version-check --quiet skills-ref

      - name: The skill validates against the Agent Skills specification
        run: python3 .kolonie-docs/.github/scripts/check-skill-spec.py skills/kolonie

  sync:
    name: Open a pull request when the shared body has moved
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # One short-lived token, scoped to this repository. The App itself is
      # installed only on the seven runtime repositories (`kolonie-docs#501`).
      - name: Become the skill publisher App
        id: publisher_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.SKILL_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.SKILL_PUBLISHER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # Persist the App token for `git push` below. The second checkout is a
      # separate public repository and keeps its ordinary read credential.
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.publisher_token.outputs.token }}
      - uses: actions/checkout@v4
        with:
          repository: Kolonie-AI/kolonie-docs
          path: .kolonie-docs

      - name: Regenerate
        run: |
          python3 .kolonie-docs/.github/scripts/build-skill.py \
            .kolonie-docs/onboarding/skill/body.md \
            skill.runtime.md \
            skills/kolonie/SKILL.md

      - name: Open a pull request if it changed
        env:
          # The same installation token authenticates `git push` (through the
          # checkout credential above) and `gh pr create`. No user identity and
          # no stored installation token outlive this run (`kolonie-docs#501`).
          GH_TOKEN: ${{ steps.publisher_token.outputs.token }}
        run: |
          set -euo pipefail
          # `git status`, not `git diff`. A skill is a directory since
          # kolonie-docs#456, and the first reference file the shared body
          # declares arrives here **untracked** — which `git diff` does not see
          # at all. It would report no change, this job would exit 0, and the
          # file carrying the operational half of the browser advice would
          # never reach a reader. `--porcelain` is empty only when nothing has
          # moved, tracked or not.
          if [ -z "$(git status --porcelain -- skills/kolonie/SKILL.md skills/kolonie/references)" ]; then
            echo "The shared body has not moved since these files were generated."
            exit 0
          fi
          BRANCH="skill-sync/$(cd .kolonie-docs && git rev-parse --short HEAD)"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "$BRANCH already exists — a pull request for this body is already open."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A skills/kolonie/SKILL.md skills/kolonie/references
          git commit -F - <<'MESSAGE'
          Regenerate SKILL.md from the shared body

          The Colony-facing half of this file moved in kolonie-docs. Regenerated by
          .github/workflows/skill.yml; kolonie-docs#171 is why this file is
          generated rather than edited.
          MESSAGE
          git push origin "$BRANCH"
          gh pr create --head "$BRANCH" --base main \
            --title "Regenerate SKILL.md from the shared body" \
            --body-file - <<'BODY'
          `onboarding/skill/body.md` in `kolonie-docs` has moved, so the generated
          `SKILL.md` here is behind it. This pull request is the regenerated file and
          nothing else.

          **Review the diff, not the process.** What is in it was written in
          `kolonie-docs`, and it arrives as a pull request rather than a push because
          the same change is landing in seven repositories at once
          ([kolonie-docs#171](https://github.com/Kolonie-AI/kolonie-docs/issues/171)).

          If something here is wrong for this runtime, the fix is in `skill.runtime.md`
          or in the shared body — never in `skills/kolonie/SKILL.md`, which is an output.
          BODY
